[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "finscraper-mx"
version = "0.1.0.dev0"
description = "Unofficial, read-only balance scrapers for Mexican banks, sofipos, brokers and crypto exchanges."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Paolo Reyes" }]
requires-python = ">=3.12"
keywords = ["mexico", "banks", "scraper", "personal-finance", "bbva", "open-finance"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: Spanish",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
]
# The core has no dependencies; each institution pulls in only what it needs.
dependencies = []

[project.optional-dependencies]
bbva-mx = ["httpx>=0.27"]
all = ["finscraper-mx[bbva-mx]"]
dev = ["pytest>=8"]

[project.scripts]
finscraper-mx = "finscraper_mx.cli:main"

[project.urls]
Source = "https://github.com/PaoloReyes/finscraper-mx"
Issues = "https://github.com/PaoloReyes/finscraper-mx/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/finscraper_mx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
