[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "finscraper-mx"
version = "0.1.0.dev0"
description = "Unofficial, read-only balance scrapers for Mexican banks, sofipos, brokers and crypto exchanges."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Paolo Reyes" }]
requires-python = ">=3.12"
keywords = ["mexico", "banks", "sofipo", "brokers", "balances", "personal-finance", "scraper"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: Spanish",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
]
dependencies = ["httpx[http2]>=0.27", "curl-cffi>=0.7", "cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
finscraper-mx = "finscraper_mx.cli:main"

[project.urls]
Source = "https://github.com/PaoloReyes/finscraper-mx"
Issues = "https://github.com/PaoloReyes/finscraper-mx/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/finscraper_mx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"  # print each test and its result as it runs
